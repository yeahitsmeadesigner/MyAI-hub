<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — MyAI Hub</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 1rem;
        padding: 2rem;
        text-align: left;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #cbd5e1;
        line-height: 1.6;
        font-size: 0.95rem;
        margin: 0 0 1.25rem;
      }
      .btn {
        display: inline-block;
        background: #0d9488;
        color: #ffffff;
        text-decoration: none;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are currently offline</h1>
      <p>
        MyAI Hub stores your tasks, smart notes, and offline command assistant locally in IndexedDB.
        Return to the main app shell to access your workspace without an internet connection.
      </p>
      <a class="btn" href="/">Open Local Workspace</a>
    </main>
  </body>
</html>
